name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/remotion-starter/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cài ASR runtime (không tải model)
        run: |
          python -m pip install -r requirements-asr.txt
          python scripts/transcribe-audio.py --help
      - name: Kiểm tra package
        run: |
          node scripts/check-knowledge-pack.mjs .
          node scripts/test-knowledge-pack.mjs .
          node scripts/validate-package.mjs
      - name: Kiểm tra skill schema
        run: python scripts/quick_validate.py .
      - name: Kiểm tra storyboard và contrast
        run: |
          node scripts/check-storyboard.mjs tests/fixtures/storyboard.valid.json
          node scripts/check-contrast.mjs '#F9F9F9' '#081938'
          node scripts/check-brand-contrast.mjs
          node scripts/check-brand-usage.mjs
          node scripts/check-brand-font.mjs
          if node scripts/check-storyboard.mjs tests/fixtures/storyboard.invalid.json; then exit 1; fi
          if node scripts/check-storyboard.mjs tests/fixtures/storyboard.invalid-typography.json; then exit 1; fi
          if node scripts/check-contrast.mjs '#365380' '#081938'; then exit 1; fi
          if node scripts/check-brand-contrast.mjs --config tests/fixtures/brand.invalid.json; then exit 1; fi
          if node scripts/check-brand-usage.mjs --config tests/fixtures/brand.invalid-identity.json; then exit 1; fi
      - name: Kiểm tra pipeline v2
        run: |
          node scripts/check-cue-lock.mjs assets/remotion-starter/src/transcript.lock.json assets/remotion-starter/src/cue-sheet.lock.json
          node scripts/check-scene-diversity.mjs assets/remotion-starter/src/video-plan.json
          node scripts/check-timeline-binding.mjs assets/remotion-starter
          node scripts/test-v2-pipeline.mjs .
      - name: Kiểm tra SFX generator
        run: node scripts/generate-sfx.mjs --out outputs/test-sfx
      - name: Cài starter
        working-directory: assets/remotion-starter
        run: npm ci
      - name: Kiểm tra installer font ngoài
        run: |
          node scripts/install-brand-font.mjs --file assets/remotion-starter/node_modules/@fontsource/montserrat/files/montserrat-vietnamese-800-normal.woff2 --project outputs/font-test-project
          node scripts/check-brand-font.mjs --project outputs/font-test-project --require-cy
      - name: Typecheck
        working-directory: assets/remotion-starter
        run: npm run typecheck
      - name: Liệt kê composition
        working-directory: assets/remotion-starter
        run: npm run compositions
      - name: Render reference v2 và contact sheet
        working-directory: assets/remotion-starter
        run: |
          npm run render:v2:reference
          npm run render:v2:contact-sheet
          npm run render:v2:semantic
          node ../../scripts/audit-motion-density.mjs ../../outputs/alpha-video-v2-semantic.mp4 --storyboard src/video-plan.json
          test $(stat -c%s ../reference/alpha-video-v2-reference.mp4) -lt 8388608
          node ../../scripts/build-qa-pack.mjs ../reference/alpha-video-v2-reference.mp4 src/cue-sheet.lock.json --out ../../outputs/qa-ci
          if node ../../scripts/check-qa-report.mjs ../../outputs/qa-ci/report.json --video ../reference/alpha-video-v2-reference.mp4 --cue-lock src/cue-sheet.lock.json; then exit 1; fi
